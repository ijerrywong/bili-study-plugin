name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 本仓库为纯 Node 内置模块实现（无第三方依赖），无需 npm install。
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: node --test
